<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasatria - 3D Periodic Visualizer</title>
    <link rel="stylesheet" href="style.css?v=4" />

    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Three.js & Addons via Importmap -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
    <!-- Halaman Log Masuk (Image A) -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit</p>
            <button id="btn-login" type="button" class="google-blue-btn" style="display: inline-flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 5px 22px 5px 6px; border: none; border-radius: 8px; background-color: #4285F4; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 6px rgba(66, 133, 244, 0.4); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                <div class="google-icon-wrapper" style="width: 34px; height: 34px; border-radius: 6px; background-color: #ffffff; display: flex; justify-content: center; align-items: center; flex-shrink: 0;">
                    <svg viewBox="0 0 48 48" width="18px" height="18px" style="display: block;">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                </div>
                <span style="color: #ffffff; font-size: 14px; font-weight: 500; letter-spacing: 0.2px;">Sign in with Google</span>
            </button>
        </div>
    </div>

    <!-- Kanvas Visualisasi 3D Three.js -->
    <div id="app-view" style="display: none;">
        <div id="container"></div>
        <div id="menu">
            <button id="table" class="active">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
            <div class="legend">
                <span>LOW</span>
                <div class="legend-bar"></div>
                <span>HIGH</span>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
